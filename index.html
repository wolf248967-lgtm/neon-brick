<style>
:root{--bg:#070914;--panel:#10152a;--line:#273253;--cyan:#28e7ff;--purple:#a45bff;--pink:#ff4f9a;--text:#eaf7ff;--muted:#8793b7;--green:#4dffb1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -15%,#18234c 0,#090d1d 48%,#050711 100%);color:var(--text);font-family:Tahoma,Arial,sans-serif}body{display:flex;justify-content:center;padding:12px}.app{width:min(100%,520px);display:flex;flex-direction:column;gap:11px;min-height:calc(100dvh - 24px)}button{font:inherit;cursor:pointer;color:inherit}.top{display:flex;align-items:center;justify-content:space-between;padding:5px 2px}.brand{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#16294a,#111126);border:1px solid #31517a;box-shadow:0 0 22px #28e7ff25,inset 0 0 15px #a45bff18;font-size:25px;color:var(--cyan)}.brand b{font-size:17px;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:4px;letter-spacing:2px}.toptools{display:flex;gap:7px}.iconbtn{width:39px;height:38px;border-radius:12px;background:#11172b;border:1px solid var(--line);font-size:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:linear-gradient(145deg,#151d37,#0d1225);border:1px solid #273454;border-radius:13px;padding:9px 5px;text-align:center;box-shadow:0 5px 18px #0003}.stat small{display:block;font-size:10px;color:var(--muted)}.stat strong{display:block;font-size:17px;color:#f5fbff;margin-top:5px;font-variant-numeric:tabular-nums}.boardwrap{position:relative;flex:1;min-height:420px;padding:7px;border-radius:18px;background:linear-gradient(135deg,#1b2c50,#11142c 45%,#3b2055);box-shadow:0 0 0 1px #38517c,0 12px 40px #0008,0 0 35px #28e7ff13}.boardwrap:before{content:"";position:absolute;inset:1px;border-radius:17px;background:linear-gradient(145deg,#111a31,#080b19 60%);pointer-events:none}.boardwrap canvas{position:relative;display:block;width:100%;height:100%;min-height:420px;border-radius:12px;touch-action:none;background:#080c1b}.hud{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;padding:0 4px}.tag{border:1px solid #27385a;background:#111a30;padding:6px 10px;border-radius:30px;color:#b8d8f7}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.action{padding:11px 5px;border-radius:12px;border:1px solid #2b3a5f;background:#11182e;font-size:12px}.action:active,.iconbtn:active{transform:scale(.97);background:#1b2b4b}.primary{border:0;background:linear-gradient(100deg,#12a9d7,#7854ed);box-shadow:0 5px 20px #258cff35;color:white;border-radius:12px;padding:12px 22px;font-weight:bold}.secondary{border:1px solid #355078;background:#111b32;border-radius:12px;padding:11px 18px}.overlay{position:absolute;z-index:5;inset:7px;border-radius:12px;background:#070a16ed;backdrop-filter:blur(12px);display:flex;align-items:flex-start;justify-content:center;padding:18px;text-align:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.overlay.hidden{display:none}.dialog{width:min(100%,350px);flex:0 0 auto;margin:auto;min-height:min-content;padding-bottom:12px}.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:3px;margin-bottom:8px}.dialog h1,.dialog h2{margin:7px 0 9px}.dialog h1{font-size:27px;letter-spacing:1px;text-shadow:0 0 20px #28e7ff77}.dialog p{font-size:12px;line-height:2;color:#aab8d5}.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:17px 0}.menuitem{background:#121a31;border:1px solid #2a3c61;border-radius:12px;padding:12px 7px;font-size:12px}.menuitem span{display:block;font-size:19px;margin-bottom:5px}.menuitem.selected{border-color:var(--cyan);box-shadow:0 0 15px #28e7ff25}.rowbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.modebar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}.mode{border:1px solid #2b3a5e;background:#10172b;padding:7px 10px;border-radius:20px;font-size:10px;color:#aab8d5}.mode.active{border-color:var(--cyan);color:var(--cyan);background:#123044}.panelgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.shopitem{padding:10px;border:1px solid #2a3b5f;background:#11182c;border-radius:12px;font-size:11px}.shopitem b{display:block;margin:5px}.shopitem button{margin-top:6px;width:100%;padding:7px;border:1px solid #355078;background:#192642;border-radius:8px;font-size:10px}.bottomnote{text-align:center;color:#56617e;font-size:9px;padding:1px}.bossbar{height:7px;background:#29304b;border-radius:10px;overflow:hidden;margin:7px 0}.bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4f9a,#ffb34d)}
@media(min-height:850px){.app{gap:13px}.boardwrap{min-height:500px}}@media(max-width:370px){.brand b{font-size:14px}.stat strong{font-size:15px}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions .action{font-size:10px;flex:1 1 28%;min-width:0}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><b>NEON BRICK</b><small>CYBER ARCADE // BREAKER</small></div></div><div class="toptools"><button class="iconbtn" id="musicBtn" title="موسیقی">♫</button><button class="iconbtn" id="soundBtn" title="صدا">◖))</button><button class="iconbtn" id="pauseBtn" title="توقف">Ⅱ</button></div></header>
<section class="stats"><div class="stat"><small>امتیاز</small><strong id="score">۰</strong></div><div class="stat"><small>رکورد</small><strong id="best">۰</strong></div><div class="stat"><small>توپ‌ها</small><strong id="balls">۱</strong></div><div class="stat"><small>سکه</small><strong id="coins">۰</strong></div></section>
<section class="boardwrap"><canvas id="game" width="420" height="650" aria-label="بازی آجرشکن نئونی"></canvas><div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div></section>
<div class="hud"><span class="tag" id="level">مرحله ۱</span><span id="hint">پایین بکش: جابه‌جایی • بالا بکش و رها کن: شلیک</span><span class="tag" id="modeLabel">کلاسیک</span></div>
<div class="actions"><button class="action" id="menuBtn">⌂ منو</button><button class="action" id="powerBtn">⚡ قدرت‌ها</button><button class="action" id="helpBtn">؟ راهنما</button></div>
<div class="bottomnote">NEON BRICK • ذخیره خودکار روی همین دستگاه • نسخه آفلاین</div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=420,H=650,COLS=10,LEFT=10,GAP=3,BW=(W-20-27)/10,BH=29,ROW=33,LAUNCH=604,DEAD=562;
const BALL_R=6.8;
const _memStore={};
const storage={getItem:k=>{try{return localStorage.getItem(k)}catch(e){return _memStore[k]||null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){_memStore[k]=String(v)}}};
const COLORS=['#28e7ff','#a45bff','#ff4f9a','#4dffb1','#ffb84d'];
let musicNodes=[],state='menu',mode='classic',score=0,best=0,coins=0,level=1,ballCount=1,baseBalls=1,extraBalls=0,bricks=[],balls=[],drops=[],particles=[],trails=[],floatTexts=[],aim=null,aimVec={x:0,y:-1},launchX=W/2,firstLanding=null,shots=0,shotTick=0,turnActive=false,frame=0,raf=0,last=0,combo=0,comboTimer=0,muted=false,musicOn=false,audio=null,shopOwned=['cyan'],skin='cyan',boss=null,timeLeft=60,challengeStep=0,achievements={},dailyDone=false,shieldCharges=0,turnFire=false,turnIce=false,turnPierce=false,turnSlow=false,ballGrow=0;
const skins={
cyan:{name:'کروی نئون',color:'#28e7ff',price:0,shape:'circle',icon:'●'},
pink:{name:'الماس پلاسما',color:'#ff4f9a',price:180,shape:'diamond',icon:'◆'},
gold:{name:'ستاره طلایی',color:'#ffc857',price:320,shape:'star',icon:'★'},
green:{name:'شش‌ضلعی سمی',color:'#4dffb1',price:250,shape:'hex',icon:'⬢'},
violet:{name:'حلقه کیهانی',color:'#a45bff',price:280,shape:'ring',icon:'◎'},
ice:{name:'کریستال یخی',color:'#8be9ff',price:300,shape:'crystal',icon:'✧'},
fireball:{name:'گوی آتشین',color:'#ff7043',price:340,shape:'flame',icon:'♨'},
bolt:{name:'صاعقه',color:'#ffe45e',price:360,shape:'bolt',icon:'ϟ'},
heart:{name:'قلب انرژی',color:'#ff5ca8',price:380,shape:'heart',icon:'♥'},
flower:{name:'گل نئون',color:'#e78bff',price:400,shape:'flower',icon:'✿'},
gear:{name:'چرخ‌دنده',color:'#b5c7e8',price:420,shape:'gear',icon:'⚙'},
comet:{name:'دنباله‌دار',color:'#65f5d2',price:480,shape:'comet',icon:'☄'},
neonHeart:{name:'قلب نئونی',color:'#ff6bcb',price:360,shape:'heart',icon:'♡'},
plasmaOrb:{name:'کره پلاسما',color:'#b388ff',price:400,shape:'circle',icon:'◉'},
voidStar:{name:'ستاره خلأ',color:'#e0e7ff',price:450,shape:'star',icon:'✦'},
toxic:{name:'سمی درخشان',color:'#76ff03',price:420,shape:'hex',icon:'☢'}
};
function load(){try{let d=JSON.parse(storage.getItem('neonBrickSave')||'{}');best=d.best||0;coins=d.coins||0;shopOwned=d.shopOwned||['cyan'];skin=d.skin||'cyan';achievements=d.achievements||{};}catch(e){}}
function save(){try{storage.setItem('neonBrickSave',JSON.stringify({best,coins,shopOwned,skin,achievements}))}catch(e){}}
function fa(n){return Math.max(0,Math.floor(n)).toLocaleString('fa-IR')}
function ui(){$('score').textContent=fa(score);$('best').textContent=fa(best);$('balls').textContent=fa(ballCount);$('coins').textContent=fa(coins);$('level').textContent='مرحله '+fa(level);$('modeLabel').textContent=({classic:'کلاسیک',survival:'بقا',time:'ضد زمان',endless:'بی‌پایان',challenge:'چالش'})[mode]||'کلاسیک';}
function tone(f=500,d=.055,type='sine'){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function music(on){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(on){if(musicNodes.length)return;[110,164.81,220].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=i===1?'triangle':'sine';o.frequency.value=f;g.gain.value=i===0?.012:.006;o.connect(g);g.connect(audio.destination);o.start();musicNodes.push({o,g})})}else{for(const n of musicNodes){n.g.gain.setTargetAtTime(0,audio.currentTime,.04);n.o.stop(audio.currentTime+.2)}musicNodes=[]}}catch(e){}}
function show(html){$('dialog').innerHTML=html;$('overlay').classList.remove('hidden')}
function hide(){$('overlay').classList.add('hidden')}
function menu(){state='menu';turnActive=false;aim=null;show(`<div class="eyebrow">WELCOME TO THE GRID</div><h1>NEON BRICK</h1><p>آجرشکن سایبرپانکی؛ آماده‌ای رکوردت رو نابود کنی؟</p><div class="modebar">${[['classic','کلاسیک'],['survival','بقا'],['time','ضد زمان'],['endless','بی‌پایان'],['challenge','چالش']].map(([v,t])=>`<button class="mode ${mode===v?'active':''}" data-mode="${v}">${t}</button>`).join('')}</div><div class="menugrid"><button class="menuitem" id="startBtn"><span>▶</span>شروع بازی</button><button class="menuitem" id="shopOpen"><span>◈</span>گالری ۱۶ شکل توپ</button><button class="menuitem" id="achOpen"><span>🏆</span>دستاوردها</button><button class="menuitem" id="rankOpen"><span>☷</span>جدول رکوردها</button></div><div class="rowbtn"><button class="secondary" id="dailyBtn">🎁 جایزه روزانه</button><button class="secondary" id="howBtn">راهنما</button></div><p style="font-size:9px;color:#657393">HARD MODE • سرعت و جان آجرها بالاتر از حالت معمولی</p>`);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;menu();ui()});$('startBtn').onclick=startGame;$('shopOpen').onclick=shop;$('achOpen').onclick=achievementPage;$('rankOpen').onclick=leaderboard;$('dailyBtn').onclick=daily;$('howBtn').onclick=help;ui()}
function help(){show(`<div class="eyebrow">HOW TO PLAY</div><h2>راهنمای بازی</h2><p>از قسمت پایین صفحه بکش: چپ و راست برای جابه‌جایی نقطه شلیک، بالا/مایل برای نشانه گرفتن، بعد رها کن تا شلیک شود. تقریباً همه زاویه‌های رو به بالا مجاز است. نگذار آجرها از خط خطر عبور کنند. دایره‌های رنگی قدرت ویژه هستند. کلیدهای جهت‌دار و A/D هم کار می‌کنند. با Space شلیک کن.</p><div class="rowbtn"><button class="primary" id="back">فهمیدم</button></div>`);$('back').onclick=()=>state==='playing'?hide():menu()}
function shop(){state='menu';show(`<div class="eyebrow">NEON GARAGE</div><h2>گالری و آپگرید</h2><p>توپ‌های نئونی را آزاد کن. علامت‌های <b>۲</b> و <b>۳</b> و <b>M</b> تعداد توپ را برای کل بازی افزایش می‌دهند (تا باخت).</p><div class="panelgrid">${Object.entries(skins).map(([id,s])=>`<div class="shopitem"><div style="font-size:29px;color:${s.color};text-shadow:0 0 15px ${s.color}">${s.icon}</div><b>${s.name}</b><span>${s.price?fa(s.price)+' سکه':'رایگان'}</span><button data-skin="${id}">${skin===id?'انتخاب شده':shopOwned.includes(id)?'انتخاب':'خرید'}</button></div>`).join('')}</div><div style="margin:14px 0 8px;font-size:12px;color:#7dd3fc">آپگرید دائمی</div><div class="panelgrid"><div class="shopitem"><div style="font-size:24px">⚡</div><b>شروع با ۲ توپ</b><span>۶۵۰ سکه</span><button id="upStart2">خرید</button></div><div class="shopitem"><div style="font-size:24px">💎</div><b>سکه بیشتر</b><span>۸۰۰ سکه</span><button id="upCoin">خرید</button></div></div><div class="rowbtn"><button class="secondary" id="backMenu">بازگشت</button></div>`);document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{let id=b.dataset.skin,s=skins[id];if(!shopOwned.includes(id)){if(coins<s.price){b.textContent='سکه کافی نیست';return}coins-=s.price;shopOwned.push(id)}skin=id;save();ui();shop()});$('backMenu').onclick=menu;
const up=JSON.parse(storage.getItem('neonUp')||'{}');
if($('upStart2'))$('upStart2').onclick=()=>{if(up.start2){$('upStart2').textContent='خریداری شده';return}$('upStart2').textContent=coins<650?'سکه کافی نیست':'خرید شد';if(coins<650)return;coins-=650;up.start2=true;storage.setItem('neonUp',JSON.stringify(up));save();ui();};
if($('upCoin'))$('upCoin').onclick=()=>{if(up.coinBoost){$('upCoin').textContent='خریداری شده';return}$('upCoin').textContent=coins<800?'سکه کافی نیست':'خرید شد';if(coins<800)return;coins-=800;up.coinBoost=true;storage.setItem('neonUp',JSON.stringify(up));save();ui();};}
function achievementPage(){let list=[['first','اولین شلیک','یک بازی را شروع کن'],['score500','امتیاز ۵۰۰','به امتیاز ۵۰۰ برس'],['brick100','آجرکوب','۱۰۰ آجر را نابود کن'],['boss','شکارچی باس','یک باس را شکست بده'],['combo10','کمبوی ۱۰','کمبو را به ۱۰ برسان']];show(`<div class="eyebrow">TROPHY ROOM</div><h2>دستاوردها</h2><div class="panelgrid">${list.map(([id,t,d])=>`<div class="shopitem" style="border-color:${achievements[id]?'var(--cyan)':'#2a3b5f'}"><b>${achievements[id]?'✓ ':''}${t}</b><span>${d}</span></div>`).join('')}</div><div class="rowbtn"><button class="secondary" id="backAch">بازگشت</button></div>`);$('backAch').onclick=menu}
function leaderboard(){let a=[];try{a=JSON.parse(storage.getItem('neonBrickScores')||'[]')}catch(e){}show(`<div class="eyebrow">LEADERBOARD</div><h2>جدول رکوردها</h2><p style="font-size:11px">${a.length?a.slice(0,8).map((r,i)=>`${i+1}. ${fa(r.score)} — ${({classic:'کلاسیک',survival:'بقا',time:'ضد زمان',endless:'بی‌پایان',challenge:'چالش'})[r.mode]||r.mode}`).join('<br>'):'هنوز رکوردی ثبت نشده'}</p><div class="rowbtn"><button class="secondary" id="backLb">بازگشت</button></div>`);$('backLb').onclick=menu}
function daily(){let today=new Date().toDateString(),d;try{d=storage.getItem('neonDaily')}catch(e){}if(d===today){$('dailyBtn').textContent='جایزه امروز دریافت شده';return}coins+=60;try{storage.setItem('neonDaily',today)}catch(e){}save();ui();$('dailyBtn').textContent='۶۰ سکه دریافت شد!';tone(880,.12)}
function brick(c,r,hp){return{x:LEFT+c*(BW+GAP),y:51+r*ROW,w:BW,h:BH,hp,max:hp}}
function makeRow(){for(let b of bricks)b.y+=ROW;for(let d of drops)d.y+=ROW;if(bricks.some(b=>b.y+BH>=DEAD)){if(shieldCharges>0){shieldCharges--;bricks=bricks.filter(b=>b.y+BH<DEAD);burst(W/2,DEAD,'#4dffb1',30)}else{endGame();return false}}let count=Math.min(8,3+Math.floor(level/3.5)+(mode==='survival'?1:0));let used=new Set();while(used.size<count)used.add(Math.floor(Math.random()*COLS));for(let c of used){let hp=Math.max(1,Math.ceil((level*0.7+Math.random()*2.2)*(mode==='endless'?1.25:1.05)));bricks.push(brick(c,0,hp))}if(Math.random()<.80){let c=Math.floor(Math.random()*COLS);let types=['multi','b2','b3','b2','bomb','laser','shield','fire','ice','b3','pierce','slow','grow','magnet'];let tp=types[Math.floor(Math.random()*types.length)];let rr=(tp==='multi'||tp==='b2'||tp==='b3')?13:10;drops.push({x:LEFT+c*(BW+GAP)+BW/2,y:68,r:rr,type:tp})}if(level%5===0&&!boss){boss={x:75,y:15,w:270,h:25,hp:Math.min(50,15+level*2),max:Math.min(50,15+level*2),dir:1}}return true}
function startGame(){score=0;level=1;let up=JSON.parse(storage.getItem('neonUp')||'{}');baseBalls=up.start2?2:1;extraBalls=0;ballCount=baseBalls;combo=0;comboTimer=0;bricks=[];balls=[];drops=[];particles=[];trails=[];floatTexts=[];boss=null;launchX=W/2;firstLanding=null;turnActive=false;shots=0;timeLeft=60;challengeStep=0;shieldCharges=0;turnFire=false;turnIce=false;turnPierce=false;turnSlow=false;ballGrow=0;state='playing';makeRow();hide();achievements.first=true;save();ui();tone(620,.08)}
function endGame(){if(state!=='playing')return;state='over';turnActive=false;best=Math.max(best,score);const reward=Math.min(18,Math.floor(score/220)+Math.min(level,8));coins+=reward;let a=[];try{a=JSON.parse(storage.getItem('neonBrickScores')||'[]')}catch(e){}a.push({score,mode,at:Date.now()});a.sort((x,y)=>y.score-x.score);try{storage.setItem('neonBrickScores',JSON.stringify(a.slice(0,10)))}catch(e){}save();ui();tone(130,.3,'sawtooth');show(`<div class="eyebrow">GAME OVER</div><h1 style="color:var(--pink)">باختی!</h1><p>آجرها از خط خطر رد شدند.<br>امتیاز نهایی: <b style="color:var(--cyan)">${fa(score)}</b><br>مرحله: ${fa(level)}<br>پاداش: ${fa(reward)} سکه</p><div class="rowbtn"><button class="primary" id="retry">تلاش دوباره</button><button class="secondary" id="toMenu">منوی اصلی</button></div>`);$('retry').onclick=startGame;$('toMenu').onclick=menu}
function normalizeAim(dx,dy){
  if(dy>-8) dy=-8;
  let m=Math.hypot(dx,dy)||1;
  let vx=dx/m, vy=dy/m;
  if(vy>-0.12){vy=-0.12;m=Math.hypot(vx,vy)||1;vx/=m;vy/=m;}
  if(vy<-0.998){vx=0;vy=-1}
  return {x:vx,y:vy};
}
function launch(x,y){
  if(state!=='playing'||turnActive)return;
  let dx=x-launchX, dy=y-LAUNCH;
  aimVec=normalizeAim(dx,dy);
  turnActive=true;firstLanding=null;shots=ballCount;shotTick=0;balls=[];
  $('hint').textContent='توپ‌ها در حال حرکت‌اند';
  spawnShot();
}
function spawnShot(){
  let sp=(7.2+Math.min(2.0,level*.03))*(turnSlow?0.72:1);
  let ox=(Math.random()-0.5)*2.5;
  let r=BALL_R+(ballGrow>0?2.2:0);

function applyPower(t,x,y){

function update(){

function loop(t){raf=requestAnimationFrame(loop);let dt=Math.min(48,t-last||16);last=t;let n=Math.min(3,Math.max(1,Math.round(dt/16)));for(let i=0;i<n;i++){frame++;update()}draw()}

function clientToGame(clientX, clientY){
  const r=canvas.getBoundingClientRect();
  if(!r.width||!r.height)return{x:W/2,y:LAUNCH};
  return {x:(clientX-r.left)*W/r.width, y:(clientY-r.top)*H/r.height};
}

function startAimAt(x,y,pid){
  if(state!=='playing'||turnActive||aiming)return false;
  if(y<H*0.38)return false;
  aiming=true;
  dragMoved=false;
  aimPointerId=pid;
  launchX=Math.max(18,Math.min(W-18,x));
  gestureStartX=launchX;
  aimVec={x:0,y:-1};
  aim={x:launchX,y:LAUNCH-120};
  return true;
}

function updateAimAt(x,y){
  if(!aiming)return;
  const dx=x-gestureStartX;
  const dy=y-LAUNCH;
  if(Math.hypot(x-launchX,y-LAUNCH)>10)dragMoved=true;
  if(y>LAUNCH-55){
    // slide only
    launchX=Math.max(18,Math.min(W-18,x));
    gestureStartX=launchX;
    // keep previous aimVec if we already aimed up; else default up
    if(!dragMoved)aimVec={x:0,y:-1};
    aim={x:launchX+aimVec.x*180,y:LAUNCH+aimVec.y*180};
  }else{
    aimVec=normalizeAim(dx,dy);
    aim={x:launchX+aimVec.x*200,y:LAUNCH+aimVec.y*200};
  }
}

function finishAim(){
  if(!aiming)return;
  aiming=false;
  aimPointerId=null;
  const hadAim=aim;
  aim=null;
  if(state!=='playing'||turnActive)return;
  if(!aimVec)aimVec={x:0,y:-1};
  // ensure upward
  if(!(aimVec.y<0))aimVec={x:0,y:-1};
  aimVec=normalizeAim(aimVec.x*100, aimVec.y*100);
  turnActive=true;
  firstLanding=null;
  shots=Math.max(1,ballCount|0);
  shotTick=0;
  balls=[];
  $('hint').textContent='توپ‌ها در حال حرکت‌اند';
  spawnShot();

function onDown(ev){
  // unify mouse / pointer / touch
  let cx,cy,pid=null;
  if(ev.touches&&ev.touches[0]){cx=ev.touches[0].clientX;cy=ev.touches[0].clientY;pid='t'+ev.touches[0].identifier;}
  else{cx=ev.clientX;cy=ev.clientY;pid=ev.pointerId!=null?ev.pointerId:'m';}
  const p=clientToGame(cx,cy);
  if(startAimAt(p.x,p.y,pid)){
    try{ev.preventDefault()}catch(_){}
  }
}
function onMove(ev){
  if(!aiming)return;
  let cx,cy;
  if(ev.touches&&ev.touches[0]){cx=ev.touches[0].clientX;cy=ev.touches[0].clientY;}
  else{cx=ev.clientX;cy=ev.clientY;}
  const p=clientToGame(cx,cy);
  updateAimAt(p.x,p.y);
  try{ev.preventDefault()}catch(_){}
}
function onUp(ev){
  if(!aiming)return;
  finishAim();
  try{ev.preventDefault()}catch(_){}
}

// Prevent context menu blocking release on long-press
canvas.addEventListener('contextmenu',e=>e.preventDefault());

$('pauseBtn').onclick=()=>{if(state==='playing'){state='paused';show(`<div class="eyebrow">PAUSED</div><h2>بازی متوقف شد</h2><p>هر وقت آماده بودی ادامه بده.</p><div class="rowbtn"><button class="primary" id="resume">ادامه بازی</button><button class="secondary" id="quit">خروج به منو</button></div>`);$('resume').onclick=()=>{state='playing';hide()};$('quit').onclick=menu}};
$('musicBtn').onclick=()=>{musicOn=!musicOn;music(musicOn);$('musicBtn').style.color=musicOn?'var(--cyan)':'';tone(musicOn?660:220,.12)};
$('soundBtn').onclick=()=>{muted=!muted;$('soundBtn').style.color=muted?'#ff4f9a':'var(--cyan)'};
$('menuBtn').onclick=menu;
$('helpBtn').onclick=help;
$('powerBtn').onclick=()=>{show(`<div class="eyebrow">POWER DATABASE</div><h2>راهنمای قدرت‌ها</h2><p>🔹 M = +۵ توپ (کل بازی) • ۲ = +۲ • ۳ = +۳<br>❄ یخ آسیب بیشتر • 🔥 آتش آسیب سه‌برابر<br>🟠 بمب • 💗 لیزر ستون • 🟢 سپر<br>⚪ P نفوذ • ⬇ کند شدن • ⬆ بزرگ شدن توپ • N مغناطیس</p><button class="secondary" id="closePower">بستن</button>`);$('closePower').onclick=()=>state==='playing'?hide():menu()};
window.addEventListener('keydown',e=>{
  if(state!=='playing')return;
  let k=e.key.toLowerCase();
  if(k==='arrowleft'){aimVec=normalizeAim(-1,-0.7);e.preventDefault()}
  if(k==='arrowright'){aimVec=normalizeAim(1,-0.7);e.preventDefault()}
  if(k==='a'){launchX=Math.max(18,launchX-16);e.preventDefault()}
  if(k==='d'){launchX=Math.min(W-18,launchX+16);e.preventDefault()}
  if(['arrowup','w'].includes(k)){aimVec=normalizeAim(aimVec.x||0,-1);e.preventDefault()}
  if(k===' '&&!turnActive){e.preventDefault();launch(launchX+aimVec.x*180,LAUNCH+aimVec.y*180)}
});
load();ui();menu();if(!raf)raf=requestAnimationFrame(loop);
})();
</script></body></html>
